# Alabasta ↔ Codex configuration.
# Merge into ~/.codex/config.toml (user-level) or <repo>/.codex/config.toml
# (project-level). Replace <deployment>, the API key, and /PATH/TO/... .

# ── Hands: Alabasta's MCP server (streamable HTTP, authenticated by an API key) ──
# Export ALABASTA_API_KEY=alab_sk_... (Settings > Agents in Alabasta) before starting Codex.
[mcp_servers.alabasta]
url = "https://fearless-warthog-265.eu-west-1.convex.site/mcp"
bearer_token_env_var = "ALABASTA_API_KEY"
enabled = true

# ── Enable lifecycle hooks (the Stop-hook enforcement is in codex/hooks.json) ──
[features]
hooks = true

# ── Training: reuse the shared resolution skill ──
# The skill is agent-agnostic; it physically lives in the claude-plugin/ dir.
[[skills.config]]
path = "/PATH/TO/alabasta-agent-bridge/claude-plugin/skills/task-resolution"
enabled = true
